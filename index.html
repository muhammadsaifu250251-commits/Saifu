<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองห้องเรียน</title>
</head>

<body>

    <h1>ระบบจองห้องเรียน</h1>

    <p>Classroom Booking System</p>

    <h2>จองห้องเรียน</h2>

    <label>เลือกห้องเรียน:</label>

    <select id="room">
        <option>ห้อง 101</option>
        <option>ห้อง 102</option>
        <option>ห้อง 103</option>
        <option>ห้องคอมพิวเตอร์</option>
    </select>

    <br><br>

    <label>วันที่จอง:</label>
    <input type="date" id="date">

    <br><br>

    <label>เวลาเริ่ม:</label>
    <input type="time" id="startTime">

    <br><br>

    <label>เวลาสิ้นสุด:</label>
    <input type="time" id="endTime">

    <br><br>

    <label>ชื่อผู้จอง:</label>
    <input type="text" id="name" placeholder="กรอกชื่อของคุณ">

    <br><br>

    <label>จุดประสงค์:</label>
    <input type="text" id="purpose" placeholder="กรอกจุดประสงค์การใช้ห้อง">

    <br><br>

    <button type="button">ยืนยันการจอง</button>

</body>
</html>
