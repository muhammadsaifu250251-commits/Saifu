<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Electricity Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>⚡ Smart Electricity Calculator</h1>

        <p>ระบบคำนวณการใช้ไฟฟ้าและค่าไฟโดยประมาณ</p>

        <div class="card">

            <h2>เพิ่มเครื่องใช้ไฟฟ้า</h2>

            <label>ชื่อเครื่องใช้ไฟฟ้า</label>
            <input type="text" id="deviceName"
                placeholder="เช่น พัดลม">

            <label>กำลังไฟ (Watt)</label>
            <input type="number" id="watt"
                placeholder="เช่น 60">

            <label>ใช้งานวันละ (ชั่วโมง)</label>
            <input type="number" id="hours"
                placeholder="เช่น 8">

            <label>จำนวนวันที่ใช้ต่อเดือน</label>
            <input type="number" id="days"
                value="30">
<label>ค่าไฟต่อหน่วย (บาท/kWh)</label>
<input type="number" id="rate"
    placeholder="เช่น 4.50"
    step="0.01">
            <button onclick="calculate()">
                คำนวณ
            </button>

        </div>


        <div class="card result">

            <h2>ผลการคำนวณ</h2>

            <p>
                พลังงานที่ใช้:
                <strong id="energy">0</strong> kWh
            </p>

            <p>
                ค่าไฟโดยประมาณ:
                <strong id="cost">0</strong> บาท
            </p>

        </div>


        <div class="card">

            <h2>รายการเครื่องใช้ไฟฟ้า</h2>

            <div id="deviceList">
                ยังไม่มีรายการ
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
